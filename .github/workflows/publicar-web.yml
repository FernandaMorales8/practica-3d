# Exporta el juego a HTML5 con Godot y lo publica en GitHub Pages.
#
# Una sola vez en GitHub: Settings > Pages > Build and deployment >
# Source: "GitHub Actions". Despues, cada push a main (o master) publica.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Debe coincidir con la version del proyecto (config/features en project.godot).
  GODOT_VERSION: "4.7.2"

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot y las plantillas pesan ~1.3 GB: se guardan en cache entre ejecuciones.
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Descargar Godot y plantillas web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Importar recursos
        run: ~/godot/godot --headless --path . --import

      - name: Exportar a web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    needs: exportar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
